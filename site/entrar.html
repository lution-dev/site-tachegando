<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar — Tá Chegando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%278%27 fill=%27%230b1f5c%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%276%27 fill=%27%23ff6a13%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="painel.css">
</head>
<body class="interna">
<div class="proto"><b>Protótipo:</b> as contas ficam só neste navegador, ainda sem conexão com o app real.</div>
<main class="auth">
  <aside class="lado">
    <a class="logo" href="index.html">Tá <i>Chegando</i></a>
    <div>
      <h1>Quem vende <em>circula.</em><br>Quem procura descobre.</h1>
      <p>Crie sua conta, complete seu cadastro no painel e deixe tudo pronto para quando o app chegar.</p>
    </div>
    <svg viewBox="0 0 420 300" aria-hidden="true"><path d="M0 260 L120 260 L120 120 L300 120 L300 40 L420 40" fill="none" stroke="#ff6a13" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 14"/><circle cx="300" cy="120" r="16" fill="#2150f5" stroke="#fff" stroke-width="3"/></svg>
  </aside>
  <div class="form"><div class="caixa">
    <h2 id="titulo">Entrar</h2>
    <p style="color:var(--suave);margin:0">Acesse seu painel.</p>
    <div class="tabs2" role="tablist">
      <button type="button" role="tab" id="t-entrar" aria-selected="true">Entrar</button>
      <button type="button" role="tab" id="t-criar" aria-selected="false">Criar conta</button>
    </div>
    <form id="f" novalidate>
      <div id="bloco-tipo" hidden>
        <span class="rot">Você é…</span>
        <div class="tipos">
          <label><input type="radio" name="tipo" value="vendedor" checked><span>Vendedor<small>Vendo em movimento</small></span></label>
          <label><input type="radio" name="tipo" value="apoio"><span>Rede de Apoio<small>Empresa ou profissional</small></span></label>
        </div>
      </div>
      <label for="email">E-mail</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="senha">Senha</label>
      <input id="senha" type="password" autocomplete="current-password" minlength="6" required>
      <div class="msg" id="msg" role="alert"></div>
      <button class="btn btn-or cheio" id="enviar" type="submit">Entrar</button>
    </form>
    <a class="volta" href="index.html">← Voltar ao site</a>
  </div></div>
</main>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
