<head>

<link rel="preload" href="/fonts/Poppins-700.woff2" as="font" type="font/woff2" crossorigin>

<body class="painel">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<div class="pn-app pn">
  <aside class="pn-lat" aria-label="Menu do painel">
    <a class="logo" href="/"><img src="img/logo-horizontal-escuro.svg" alt="Tá Chegando" height="46"></a>
    <p class="pn-gl" id="gl-principal">Principal</p>
    <div class="pn-grupo" role="group" aria-labelledby="gl-principal">
    <button class="pn-item" data-v="inicio" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span class="tx">Início</span></button>
    <button class="pn-item" data-v="perfil"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span class="tx">Meu cadastro</span></button>
    <button class="pn-item" data-v="metricas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><span class="tx">Métricas</span><small>em breve</small></button>
    </div>
    <div class="pn-rodape">
      <div class="pn-quem" id="quem"></div>
      <button class="pn-sair" id="sair" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span class="tx">Sair da conta</span></button>
    </div>
  </aside>
  <div class="pn-col">
    <header class="pn-top">
      <a class="logo" href="/"><img src="img/logo-horizontal.svg" alt="Tá Chegando" height="40"></a>
      <p class="pn-top-t" id="top-t">Início</p>
      <span class="proto-tag" role="note">Protótipo</span>
      <div class="pn-top-u" id="top-u"></div>
      <button type="button" id="sair-m" aria-label="Sair da conta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg><span class="tx">Sair</span></button>
    </header>
    <main class="pn-main" id="conteudo" tabindex="-1">
      <div id="tela"></div>
    </main>
  </div>
</div>
<nav class="pn-tabs" aria-label="Painel">
  <button data-v="inicio" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Início</button>
  <button data-v="perfil"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Cadastro</button>
  <button data-v="metricas"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Métricas</button>
</nav>
